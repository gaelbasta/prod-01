# =============================================================================
# Telegraf — PROD-01 (ADR-031). Installé dans /etc/telegraf/telegraf.conf par scripts/telegraf.sh.
# Même base que dev-linux (intervalle 15 s, bucket « infrastructure ») + mesures propres à la prod.
# Le token (« InfluxDB – telegraf-prod-01 », écriture seule) est dans /etc/default/telegraf
# (INFLUX_TOKEN=…, root 600) — JAMAIS dans ce fichier.
# =============================================================================
[agent]
  interval = "15s"
  round_interval = true
  flush_interval = "15s"
  hostname = "prod-01"
  skip_processors_after_aggregators = true

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.26:8087"]
  token = "${INFLUX_TOKEN}"
  organization = "c444e86edcba2a04"
  bucket = "infrastructure"

# --- Base commune (comme dev-linux) -----------------------------------------
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]
[[inputs.system]]

[[inputs.disk]]
  mount_points = ["/", "/var/lib/rancher"]

[[inputs.diskio]]
  devices = ["nvme0n1"]
  skip_serial_number = true

[[inputs.net]]
  interfaces = ["enp3s0"]

[[inputs.sensors]]
  [inputs.sensors.tagpass]
    chip = ["k10temp-pci-00c3", "nvme-pci-0500", "amdgpu-pci-c600"]

# --- Propre à la prod ---------------------------------------------------------
# Santé du NVMe (smartctl via sudo, autorisé par /etc/sudoers.d/telegraf-smart)
[[inputs.smart]]
  interval = "10m"
  use_sudo = true
  path_smartctl = "/usr/sbin/smartctl"
  devices = ["/dev/nvme0 -d nvme"]
  attributes = true

# Redémarrage requis, âge de la dernière sauvegarde réussie (scripts/telegraf-etat.sh)
[[inputs.exec]]
  interval = "60s"
  commands = ["/usr/local/bin/telegraf-etat"]
  timeout = "10s"
  data_format = "influx"
