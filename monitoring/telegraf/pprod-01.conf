# =============================================================================
# Telegraf — pprod-01, le coffre de sauvegarde (ADR-031). Installé dans /etc/telegraf/telegraf.conf
# par scripts/telegraf.sh. Même base que dev-linux + coffre + surveillance de PROD-01 « de l'extérieur ».
# Le token (« InfluxDB – telegraf-pprod-01 », écriture seule) est dans /etc/default/telegraf
# (INFLUX_TOKEN=…, root 600) — JAMAIS dans ce fichier.
# =============================================================================
[agent]
  interval = "15s"
  round_interval = true
  flush_interval = "15s"
  hostname = "pprod-01"
  skip_processors_after_aggregators = true

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.26:8087"]
  token = "${INFLUX_TOKEN}"
  organization = "c444e86edcba2a04"
  bucket = "infrastructure"

# --- Base commune (comme dev-linux) -----------------------------------------
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]
[[inputs.system]]

[[inputs.disk]]
  mount_points = ["/", "/var/lib/rancher", "/srv/sauvegardes"]

[[inputs.diskio]]
  devices = ["sda", "sdb"]
  skip_serial_number = true

[[inputs.net]]
  interfaces = ["enp1s0"]

[[inputs.sensors]]
  [inputs.sensors.tagpass]
    chip = ["coretemp-isa-0000"]

# --- Coffre de sauvegarde -------------------------------------------------------
# Santé du SSD système et de l'IronWolf (derrière le boîtier USB : -d sat).
# Noms /dev/disk/by-id stables (l'IronWolf est vu via la puce ASMedia du boîtier CENMATE, baie 1 ;
# changer de boîtier ou de baie = changer ce nom). nocheck = standby : ne réveille pas un disque endormi.
[[inputs.smart]]
  interval = "10m"
  use_sudo = true
  path_smartctl = "/usr/sbin/smartctl"
  nocheck = "standby"
  devices = [
    "/dev/disk/by-id/ata-512GB_SSD_MP28B87213930 -d sat",
    "/dev/disk/by-id/usb-ASMT_2115_ACAAEBBB4AA4-0:0 -d sat",
  ]
  attributes = true

# Redémarrage requis, âge du dernier entretien, disque monté, rest-server actif (scripts/telegraf-etat.sh)
[[inputs.exec]]
  interval = "60s"
  commands = ["/usr/local/bin/telegraf-etat"]
  timeout = "10s"
  data_format = "influx"

# --- PROD-01 vu de l'extérieur ------------------------------------------------------
# Si PROD-01 tombe entièrement, c'est ici qu'on le voit (en plus de l'absence de ses propres données).
[[inputs.http_response]]
  interval = "60s"
  urls = ["https://prism.prod.gba-lab.win/healthz", "https://wiki.prod.gba-lab.win/"]
  response_timeout = "10s"
  method = "GET"
  follow_redirects = false

# Échéance du certificat wildcard *.prod.gba-lab.win (renouvelé ~30 j avant, ADR-022)
[[inputs.x509_cert]]
  interval = "1h"
  sources = ["https://prism.prod.gba-lab.win:443"]
