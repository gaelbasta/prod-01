              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ffy1kruauqtxcb
              model:
                datasource:
                    type: influxdb
                    uid: ffy1kruauqtxcb
                intervalMs: 1000
                maxDataPoints: 43200
                query: "  from(bucket: \"infrastructure\")\r\n    |> range(start: -5m)\r\n    |> filter(fn: (r) => r._measurement == \"system\" and r._field == \"uptime\" and r.host == \"prod-01\")\r\n    |> count()"
