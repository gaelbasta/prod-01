# =============================================================================
# Règles d'alerte Grafana du dossier « prod-01 » (ADR-031) — export YAML de Grafana du 2026-10-15.
# Référence versionnée : les règles vivent dans Grafana (machine Home Assistant, 192.168.1.26) ;
# après toute modification dans l'interface, refaire l'export (runbook surveillance.md, section D)
# et remplacer ce fichier. Aucun secret ici : l'adresse du webhook est dans le contact point,
# pas dans les règles (datasourceUid = identifiant de la source InfluxDB, pas un secret).
# Correction appliquée le 2026-10-15 : règle « entretien du coffre », seuil > 0 (et non > 5).
# =============================================================================
apiVersion: 1
groups:
    - orgId: 1
