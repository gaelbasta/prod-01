                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 2m
          annotations:
            summary: PROD-01 n'envoie plus de mesures depuis 5 min (éteint, réseau coupé ou Telegraf arrêté)
          isPaused: false
          notification_settings:
            receiver: Home Assistant — dev-linux
