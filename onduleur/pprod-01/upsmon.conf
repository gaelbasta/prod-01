# /etc/nut/upsmon.conf de pprod-01 — MODÈLE du repo prod-01 (onduleur/pprod-01/upsmon.conf), phase 15
# Le marqueur du mot de passe (MONITOR) est remplacé à l'installation par scripts/onduleur.sh (jamais dans Git).

RUN_AS_USER nut

# Surveiller l'onduleur partagé par PROD-01, en SECONDAIRE : s'éteindre quand PROD-01 lève le drapeau
# « arrêt forcé » (FSD), ou si l'onduleur annonce « batterie faible ».
MONITOR onduleur@192.168.1.16 1 upsmon-pprod-01 @@MDP_PPROD_01@@ secondary
MINSUPPLIES 1

SHUTDOWNCMD "/usr/sbin/shutdown -h +0"

POLLFREQ 5
POLLFREQALERT 5
DEADTIME 15
FINALDELAY 5

NOTIFYFLAG ONLINE   SYSLOG+WALL
NOTIFYFLAG ONBATT   SYSLOG+WALL
NOTIFYFLAG LOWBATT  SYSLOG+WALL
NOTIFYFLAG FSD      SYSLOG+WALL
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG COMMBAD  SYSLOG+WALL
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG REPLBATT SYSLOG+WALL
NOTIFYFLAG NOCOMM   SYSLOG+WALL

RBWARNTIME 43200
NOCOMMWARNTIME 300
OFFDURATION 30
OVERDURATION -1
ALARMCRITICAL 1
