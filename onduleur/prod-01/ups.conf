# /etc/nut/ups.conf de PROD-01 — géré par le repo prod-01 (onduleur/prod-01/ups.conf), phase 15
# Le pilote : comment PROD-01 parle à l'onduleur par le câble USB.

# Si l'onduleur ne répond pas au démarrage, réessayer 3 fois avant d'abandonner.
maxretry = 3

[onduleur]
    driver = usbhid-ups
    port = auto
    vendorid = 0463
    productid = FFFF
    desc = "Eaton 3S 850 FR - PROD-01, pprod-01, box HA, switch"
    # Ordre final de PROD-01 : couper les prises 120 s plus tard (laisse à la box HA, ~2 min
    # d'arrêt, le temps de finir), puis les rallumer au plus tôt 300 s après l'ordre, soit au
    # moins 3 min coupées : la box HA Green ne redémarre que si son courant a vraiment disparu.
    # Essai du 2026-10-17 avec 20 s / 30 s : box HA arrêtée 20 s avant la coupure, et non redémarrée.
    offdelay = 120
    ondelay = 300
