# /etc/nut/upssched.conf de PROD-01 — géré par le repo prod-01 (onduleur/prod-01/upssched.conf), phase 15
# Le minuteur : 5 minutes sur batterie → arrêt général (décision de Gael, 2026-10-17).

CMDSCRIPT /etc/nut/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Le courant saute : noter la coupure, lancer le minuteur de 300 s.
AT ONBATT * EXECUTE coupure
AT ONBATT * START-TIMER arret-general 300

# Le courant revient avant la fin : annuler le minuteur, noter le retour.
AT ONLINE * CANCEL-TIMER arret-general
AT ONLINE * EXECUTE retour
