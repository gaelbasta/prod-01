# /etc/nut/upsmon.conf de PROD-01 — MODÈLE du repo prod-01 (onduleur/prod-01/upsmon.conf), phase 15
# Le surveillant : il suit l'état de l'onduleur et éteint PROD-01 quand il le faut.
# Le marqueur du mot de passe (MONITOR) est remplacé à l'installation par scripts/onduleur.sh (jamais dans Git).

# Le surveillant tourne avec l'utilisateur sans droits « nut » (seul l'arrêt final se fait en root).
RUN_AS_USER nut

# Surveiller « onduleur » sur cette machine, en PRIMAIRE (c'est elle qui ordonne la coupure finale).
MONITOR onduleur@localhost 1 upsmon-prod-01 @@MDP_PROD_01@@ primary
MINSUPPLIES 1

# Commande d'arrêt de la machine.
SHUTDOWNCMD "/usr/sbin/shutdown -h +0"

# Les événements marqués EXEC sont confiés à upssched, qui gère le minuteur de 5 minutes (upssched.conf).
NOTIFYCMD /usr/sbin/upssched

# Interroger l'onduleur toutes les 5 s ; il est déclaré « muet » après 15 s sans nouvelles.
POLLFREQ 5
POLLFREQALERT 5
DEADTIME 15

# Lors d'un arrêt général, attendre au plus 15 s que les secondaires se déconnectent avant de s'éteindre.
HOSTSYNC 15

# Fichier posé juste avant l'arrêt : le script final d'Ubuntu (system-shutdown/nutshutdown) le voit
# et demande alors à l'onduleur de couper ses prises (20 s plus tard) puis de les rallumer au retour du courant.
POWERDOWNFLAG "/etc/killpower"
FINALDELAY 5

# Que faire de chaque événement : journal système (SYSLOG), message dans les terminaux (WALL),
# et pour ONBATT / ONLINE, transmission à upssched (EXEC) pour lancer / annuler le minuteur.
NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL
NOTIFYFLAG FSD      SYSLOG+WALL
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG COMMBAD  SYSLOG+WALL
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG REPLBATT SYSLOG+WALL
NOTIFYFLAG NOCOMM   SYSLOG+WALL

# Valeurs d'origine d'Ubuntu, conservées : rappel « batterie à remplacer » toutes les 12 h,
# avertissement après 5 min sans contact avec l'onduleur.
RBWARNTIME 43200
NOCOMMWARNTIME 300
OFFDURATION 30
OVERDURATION -1
ALARMCRITICAL 1
