apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true   # nécessaire : Homepage interroge l'API Kubernetes
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.2.0   # version figée (2026-09-02) — jamais latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Noms acceptés (protection de Homepage) : l'adresse publique + IP du pod pour les sondes Kubernetes
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.prod.gba-lab.win,$(MY_POD_IP):3000
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
            - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: config, mountPath: /app/config/services.yaml, subPath: services.yaml }
            - { name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
            - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
            - { name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml }
            - { name: config, mountPath: /app/config/custom.css, subPath: custom.css }
            - { name: config, mountPath: /app/config/custom.js, subPath: custom.js }
            - { name: logs, mountPath: /app/config/logs }
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
