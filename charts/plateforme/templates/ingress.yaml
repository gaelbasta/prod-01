apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  {{- if .Values.tls }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}   # pas de secretName : certificat par défaut de Traefik (ADR-022)
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
