# Test de restauration n°3 (phase 7, ADR-027) : une app du chart plateforme avec un volume de données.
# nginx sert directement le contenu de son volume → on lit en HTTPS ce qu'on y a écrit, avant et après restauration.
# Déployer : helm upgrade --install restauration oci://ghcr.io/gaelbasta/charts/plateforme --version 0.2.0 \
#              -n restauration --create-namespace -f tests/values-restauration-prod.yaml --kube-context prod-01
#            (sans --wait : le pod n'est « prêt » qu'une fois sante.txt écrit dans le volume)
# Tester   : https://restauration.prod.gba-lab.win/preuve.txt
# Nettoyer : helm uninstall restauration -n restauration --kube-context prod-01
#            kubectl --context prod-01 delete namespace restauration   (supprime aussi le volume)
profile: app
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.30-alpine"
port: 8080
healthPath: /sante.txt
host: restauration.prod.gba-lab.win
persistence:
  enabled: true
  size: 100Mi
  mountPath: /usr/share/nginx/html
